<style>
/* ============ WASHI DESIGN SYSTEM · 京都和纸 ============ */
:root {
  --bg:    #F5F1EA;
  --bg2:   #EBE5DA;
  --bg3:   #E0D8CC;
  --ink:   #1A1A1A;
  --ink2:  #3A3A3A;
  --muted: #7A7268;
  --hair:  rgba(26,26,26,0.10);
  --hair2: rgba(26,26,26,0.18);
  --red:   #B5462A;
  --redD:  #8C2E1A;
  --redL:  rgba(181,70,42,0.08);
  --card:  #FFFFFF;
  --err:   #B5462A;
  --errbg: rgba(181,70,42,0.06);
  --serif-jp: "Noto Serif JP","Cormorant Garamond",serif;
  --serif:    "Instrument Serif","Cormorant Garamond",serif;
  --sans:     "Noto Sans JP",-apple-system,system-ui,sans-serif;
  --mono:     "JetBrains Mono",ui-monospace,monospace;
}
/* Washi is a paper/light theme — dark mode not applied */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px}

/* ── SHELL ── */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}

/* ── PAPER GRAIN (background texture) ── */
.grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 18% 8%, rgba(181,70,42,0.035) 0,transparent 42%),
    repeating-linear-gradient(0deg,rgba(0,0,0,0.011) 0 1px,transparent 1px 3px);
}

/* ── STATUS BAR SPACER ── */
.sb{height:env(safe-area-inset-top,0px);background:var(--bg);position:relative;z-index:10}

/* ── TOP CHROME ── */
.chrome{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px 8px;
  background:var(--bg);
  border-bottom:1px solid var(--hair);
  position:relative;z-index:10;flex-shrink:0;
}
.logo-wrap{display:flex;align-items:center;gap:10px}
.hanko{
  width:30px;height:30px;background:var(--red);color:var(--bg);
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif-jp);font-weight:700;font-size:16px;
  transform:rotate(-3deg);flex-shrink:0;
}
.logo-name{font-family:var(--serif);font-size:15px;font-style:italic;line-height:1;color:var(--ink)}
.logo-sub{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:1.5px;margin-top:2px}
.chrome-right{display:flex;align-items:center;gap:10px}
.lang-pill{
  font-family:var(--mono);font-size:9px;letter-spacing:1.5px;
  padding:4px 9px;border:1px solid var(--hair2);background:transparent;
  color:var(--muted);cursor:pointer;text-transform:uppercase;
}
.lang-pill:active{background:var(--bg2)}
.user-pill{
  display:flex;align-items:center;gap:6px;
  padding:3px 8px 3px 3px;border:1px solid var(--hair2);cursor:pointer;
}
.user-pip{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:500;color:white;flex-shrink:0}
.user-nm{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.sync-pip{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sync-pip.synced{background:var(--red)}
.sync-pip.syncing{background:#C4891C;animation:pulse 1s infinite}
.sync-pip.offline{background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── DEST CHIPS ── */
.dest-scroll{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--hair);flex-shrink:0;position:relative;z-index:10;background:var(--bg)}
.dest-scroll::-webkit-scrollbar{display:none}
.dest-chip{
  padding:9px 18px;font-family:var(--mono);font-size:9px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;
  background:transparent;border-top:none;border-left:none;border-right:none;
  transition:color 0.15s;flex-shrink:0;
}
.dest-chip.active{color:var(--red);border-bottom-color:var(--red)}
.dest-chip.add{border-bottom-color:transparent;color:var(--muted);border-bottom-style:dashed}
.dest-chip-x{font-size:13px;opacity:0.5}

/* ── TAB BAR (bottom) ── */
.tabbar{
  display:flex;border-top:1px solid var(--hair);background:var(--bg);
  flex-shrink:0;position:relative;z-index:10;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 8px;background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);transition:color 0.15s;
}
.tab-btn.active{color:var(--red)}
.tab-btn svg{transition:opacity 0.15s}
.tab-btn.active svg{opacity:1}

/* ── BODY SCROLL ── */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:1}

/* ── COMMON COMPONENTS ── */
.page-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 22px 10px;
  border-bottom:1px solid var(--hair);
}
.page-title-jp{font-family:var(--serif-jp);font-size:16px;font-weight:500;letter-spacing:4px;color:var(--ink)}
.red-rule{height:2px;background:var(--red);margin:0 22px}
.section-label{
  font-family:var(--mono);font-size:9px;letter-spacing:2px;
  color:var(--red);text-transform:uppercase;
}
.section-label-jp{font-family:var(--serif-jp);font-size:11px;color:var(--muted)}
.hair-line{height:1px;background:var(--hair)}

/* Forms */
.f-label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.f-inp{
  width:100%;padding:11px 13px;
  border:1px solid var(--hair2);background:var(--card);
  color:var(--ink);font-size:15px;font-family:var(--sans);
  -webkit-appearance:none;transition:border-color 0.15s;
}
.f-inp:focus{outline:none;border-color:var(--red)}
.f-inp.err{border-color:var(--err);background:var(--errbg)}
.f-inp::placeholder{color:var(--muted);font-size:13px}
.f-sel{
  width:100%;padding:11px 10px;
  border:1px solid var(--hair2);background:var(--card);
  color:var(--ink);font-size:14px;font-family:var(--sans);-webkit-appearance:none;
}
.f-group{display:flex;flex-direction:column;margin-bottom:14px}
.req{color:var(--red)}
.btn-red{
  width:100%;padding:14px;background:var(--red);border:none;
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--bg);cursor:pointer;
}
.btn-red:active{background:var(--redD)}
.btn-ghost{
  width:100%;padding:12px;background:transparent;
  border:1px solid var(--hair2);
  font-family:var(--mono);font-size:9px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);cursor:pointer;
}
.btn-ghost:active{background:var(--bg2)}
.del-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:4px 8px;line-height:1}
.del-btn:active{color:var(--red)}
.err-tip{font-family:var(--mono);font-size:9px;color:var(--err);margin-top:4px;letter-spacing:0.5px}
.info-band{
  border-left:2px solid var(--red);background:var(--redL);
  padding:10px 14px;font-size:13px;color:var(--ink2);line-height:1.6;
  margin-bottom:12px;
}
.warn-band{
  border-left:2px solid #C4891C;background:rgba(196,137,28,0.07);
  padding:10px 14px;font-size:13px;color:var(--ink2);line-height:1.6;
  margin-bottom:12px;
}

/* ── OVERVIEW ── */
.ov-hero{display:flex;padding:28px 22px 20px;align-items:flex-start;gap:16px}
.ov-vert{writing-mode:vertical-rl;font-family:var(--serif-jp);font-size:38px;font-weight:500;line-height:1;letter-spacing:6px;color:var(--ink);flex-shrink:0}
.ov-headline{flex:1;padding-top:4px}
.ov-mono{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--red);margin-bottom:10px}
.ov-serif-big{font-family:var(--serif);font-size:40px;font-weight:400;line-height:0.95;letter-spacing:-1.5px}
.ov-serif-it{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink2);margin-top:2px;letter-spacing:-0.5px}
.ov-dates{font-family:var(--serif-jp);font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7}
.ov-index{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:22px}
.stat-row{display:flex;align-items:baseline;gap:14px;padding:14px 22px;border-top:1px solid var(--hair)}
.stat-row:last-child{border-bottom:1px solid var(--hair)}
.stat-n{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--red);width:28px;font-weight:400}
.stat-label{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--muted)}
.stat-v{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-1px}
.stat-u{font-size:13px;color:var(--muted);margin-left:4px;font-family:var(--serif-jp)}
.upnext-card{margin:0 22px 24px;background:var(--card);border:1px solid var(--hair)}
.upnext-img{height:130px;background:repeating-linear-gradient(45deg,var(--bg2) 0 8px,var(--bg) 8px 16px);position:relative;overflow:hidden}
.img-label{position:absolute;top:8px;left:10px;font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--muted)}

/* ── PLACES ── */

.tl-title{font-family:var(--serif-jp);font-size:18px;font-weight:500;line-height:1.2;letter-spacing:0.5px}
.tl-sub{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin-top:4px}
.tl-dist{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:6px;letter-spacing:0.5px}

}

/* ── STAY ── */

/* ── FOOD ── */

.food-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.5px;margin-top:3px}
.food-tag{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;padding:3px 8px;background:var(--redL);color:var(--red);text-transform:uppercase;flex-shrink:0}
.food-item.eaten .food-tag{background:var(--bg2);color:var(--muted)}
.food-add{padding:14px 22px;border-top:1px solid var(--hair);background:var(--bg2)}

/* ── LUGGAGE ── */
.lug-item{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--hair);cursor:pointer}
.lug-item:active{background:var(--bg2)}

.lug-item.chk .lug-box{background:var(--red);border-color:var(--red)}
.lug-tick{font-size:10px;color:var(--bg);display:none;font-weight:700}

.lug-label{font-family:var(--sans);font-size:14px;color:var(--ink);flex:1}
.lug-item.chk .lug-label{text-decoration:line-through;color:var(--muted)}
.lug-cat{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.lug-add{padding:14px 22px;border-top:1px solid var(--hair);background:var(--bg2);display:flex;gap:8px}

/* ── BUDGET ── */
.budget-total{padding:20px 22px 14px}

.total-sym{font-family:var(--serif);font-size:22px;color:var(--muted);font-style:italic}

.total-per{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);margin-top:8px}
.settle-card{margin:0 22px 18px;background:var(--card);border:1px solid var(--hair);padding:20px}
.settle-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.settle-mono{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted)}
.settle-jp{font-family:var(--serif-jp);font-size:11px;color:var(--muted)}

.settle-bar{display:flex;height:4px;margin-top:18px;gap:2px}
.settle-ok{padding:16px;text-align:center;font-family:var(--serif-jp);font-size:15px;color:var(--red)}
.exp-entries{padding:0 22px 28px}
.entries-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}

.exp-name{font-family:var(--serif-jp);font-size:15px;font-weight:500;flex:1}

.paid-bar-wrap{flex:1;height:2px;background:var(--hair2);overflow:hidden}
.paid-bar-fill{height:100%}
.paid-name{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--ink2);min-width:36px;text-transform:uppercase}

.budget-members{padding:16px 22px;border-bottom:1px solid var(--hair);display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.m-card{display:flex;flex-direction:column;align-items:center;gap:4px}

.exp-add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.currency-row{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--hair)}

.login-inp{
  width:100%;padding:16px;background:rgba(255,255,255,0.08);
  border:1.5px solid rgba(255,255,255,0.35);

}

.ico{display:block;flex-shrink:0}

function hotelForDate(dateStr){
  var d=D();if(!d.hotels)return null;
  return d.hotels.find(function(h){return (h.cin||h.checkin)&&(h.cout||h.checkout)&&dateStr>=(h.cin||h.checkin)&&dateStr<(h.cout||h.checkout);})||null;
}
// Returns ALL hotels covering a date (handles rare multi-hotel same day)
function hotelsForDate(dateStr){
  var d=D();if(!d.hotels)return[];
  return d.hotels.filter(function(h){
    var ci=h.cin||h.checkin||'', co=h.cout||h.checkout||'';
    return ci&&co&&dateStr>=ci&&dateStr<co;
  });
}
function hotelsOverlap(hotels){
  for(var i=0;i<hotels.length;i++){
    for(var j=i+1;j<hotels.length;j++){
      var a=hotels[i],b=hotels[j];
      var aci=a.cin||a.checkin||'',aco=a.cout||a.checkout||'';
      var bci=b.cin||b.checkin||'',bco=b.cout||b.checkout||'';
      if(!aci||!aco||!bci||!bco)continue;
      if(aci<bco&&bci<aco)return true;
    }
  }
  return false;
}

function buildDays(){
  var d=D();if(!d.start||!d.end)return[];
  var days=[],cur=new Date(d.start+'T12:00:00'),end=new Date(d.end+'T12:00:00');
  while(cur<=end){
    var ds=cur.toISOString().slice(0,10);
    var ex=d.schedule.find(function(s){return s.date===ds;});
    if(!ex){ex={date:ds,placeIds:[]};d.schedule.push(ex);}
    days.push(ex);cur.setDate(cur.getDate()+1);
  }
  return days;
}

function cleanOrphanedExpenses(){
  var d=D();
  // Remove sched_ expenses where the schedule item no longer exists
  var allPids={};
  d.schedule.forEach(function(day){
    day.placeIds.forEach(function(pid){
      allPids['sched_'+day.date+'_'+pid]=true;
    });
  });
  // Remove segtp_ expenses where segment no longer exists
  var allSegs={};
  d.schedule.forEach(function(day){
    for(var i=0;i<day.placeIds.length-1;i++){
      allSegs['segtp_'+day.date+'_'+day.placeIds[i]+'_'+day.placeIds[i+1]]=true;
    }
  });
  var before=d.expenses.length;
  d.expenses=d.expenses.filter(function(e){
    var sid=String(e.id);
    if(sid.indexOf('sched_')===0) return !!allPids[sid];
    if(sid.indexOf('segtp_')===0) return !!allSegs[sid];
    return true; // keep manual entries
  });
  var removed=before-d.expenses.length;
  save();render();
  if(removed>0) alert((LANG==='zh'?'已清除 ':'Removed ')+removed+(LANG==='zh'?' 条旧数据':' stale entries'));
}

function removeFromDay(date,pid,e){
  e.stopPropagation();
  var d=D();
  var day=d.schedule.find(function(s){return s.date===date;});
  if(!day) return;
  var idx=day.placeIds.indexOf(pid);
  if(idx<0) return;
  // Clean up ALL segment keys touching this item
  // Before pid: placeIds[idx-1] -> pid
  if(idx>0){
    var prevPid=day.placeIds[idx-1];
    var segKey1='seg_'+date+'_'+prevPid+'_'+pid;
    var segTpKey1='segtp_'+date+'_'+prevPid+'_'+pid;
    delete S.doneItems[segKey1];
    delete S.doneItems['segcost_'+date+'_'+prevPid+'_'+pid];
    delete S.doneItems['segpay_'+date+'_'+prevPid+'_'+pid];
    // Remove from transport list
    d.transport=d.transport.filter(function(t){return t.id!==segTpKey1;});
    // Remove from expenses
    d.expenses=d.expenses.filter(function(ex){return ex.id!==segTpKey1;});
  }
  // After pid: pid -> placeIds[idx+1]
  if(idx<day.placeIds.length-1){
    var nextPid=day.placeIds[idx+1];
    var segKey2='seg_'+date+'_'+pid+'_'+nextPid;
    var segTpKey2='segtp_'+date+'_'+pid+'_'+nextPid;
    delete S.doneItems[segKey2];
    delete S.doneItems['segcost_'+date+'_'+pid+'_'+nextPid];
    delete S.doneItems['segpay_'+date+'_'+pid+'_'+nextPid];
    d.transport=d.transport.filter(function(t){return t.id!==segTpKey2;});
    d.expenses=d.expenses.filter(function(ex){return ex.id!==segTpKey2;});
  }
  // Remove own schedule expense
  var ownExpId='sched_'+date+'_'+pid;
  d.expenses=d.expenses.filter(function(ex){return ex.id!==ownExpId;});
  // Remove timing data
  delete S.doneItems['arr_'+date+'_'+pid];
  delete S.doneItems['dep_'+date+'_'+pid];
  delete S.doneItems['cost_'+date+'_'+pid];
  delete S.doneItems['payer_'+date+'_'+pid];
  // Remove item from day
  day.placeIds=day.placeIds.filter(function(p){return p!==pid;});
  save();render();
}

function setCurrency(v){D().currency=v;save();render();}
function calcBal(){
  var bal={};members.forEach(function(m){bal[m.id]=0;});
  D().expenses.forEach(function(e){
    // Skip unassigned (payer='') and self-paid (payer='self')
    if(!e.payer || e.payer==='' || e.payer==='self') return;
    // Skip zero amounts
    if(!e.amount || e.amount===0) return;
    // Determine who shares the cost
    var sm;
    if(e.split==='all') sm=members.map(function(m){return m.id;});
    else if(e.split && e.split!=='all') sm=[e.split];
    else sm=members.map(function(m){return m.id;});
    var sh=e.amount/sm.length;
    // Only credit valid members
    var payerIsValid=members.some(function(m){return m.id===e.payer;});
    if(payerIsValid) bal[e.payer]=(bal[e.payer]||0)+e.amount;
    sm.forEach(function(id){
      if(bal.hasOwnProperty(id)) bal[id]-=sh;
    });
  });
  return bal;
}
function calcSettle(bal){
  var pos=[],neg=[];
  Object.keys(bal).forEach(function(id){
    var v=bal[id];var m=members.find(function(m){return m.id===id;});if(!m)return;
    if(v>0.5)pos.push({name:m.name,col:m.col,amt:v});
    else if(v<-0.5)neg.push({name:m.name,col:m.col,amt:-v});
  });
  var txns=[],pp=pos.map(function(x){return{name:x.name,col:x.col,amt:x.amt};}),nn=neg.map(function(x){return{name:x.name,col:x.col,amt:x.amt};});
  while(pp.length&&nn.length){var g=nn[0],r=pp[0],a=Math.min(g.amt,r.amt);txns.push({from:g,to:r,amt:Math.round(a*100)/100});g.amt-=a;r.amt-=a;if(g.amt<0.5)nn.shift();if(r.amt<0.5)pp.shift();}
  return txns;
}

// Cloud load: pull data for this user
function _applyCloudData(doc) {
  if(doc.dests)   dests   = doc.dests;
  if(doc.luggage) luggage = doc.luggage;
  if(doc.members) members = doc.members;
  if(doc.state) {
    S.doneItems = doc.state.doneItems || {};
    S.doneLug   = doc.state.doneLug   || {};
    if(doc.state.dest && dests[doc.state.dest]) S.dest = doc.state.dest;
  }
  localSave();
}
function cloudLoad(callback) {
  if(!currentUser) { updateSyncIndicator('offline'); if(callback) callback(false); return; }
  updateSyncIndicator('syncing');
  console.log('[WP] cloudLoad → fetching for', currentUser.code);

      if(cloudTs >= localTs2) {
        _applyCloudData(doc);
        console.log('[WP] Loaded from cloud ✓');

        console.log('[WP] Local is newer - pushing to cloud');
        cloudSave();
      }
      _cloudSyncReady = true;
      updateSyncIndicator('synced');
      if(callback) callback(true);
    } else {
      // DB empty = new user, push local data up
      console.log('[WP] No cloud data found, pushing local data up');
      _cloudSyncReady = true;
      updateSyncIndicator('synced');
      cloudSave();
      if(callback) callback(false);
    }
  })
  .catch(function(e){
    console.warn('[WP] cloudLoad error:', e.message||e);

    if(callback) callback(false);
  });
}

function loadUserData(callback) {
  // Phase 1: try Feishu cloud
  if (FEISHU_CONFIG.app_id && currentUser.feishuSheet) {
    updateSyncIndicator('syncing');
    feishuLoad(function(cloudData) {
      if (cloudData) {
        // Cloud data wins — load it
        try {
          if (cloudData.dests) dests = cloudData.dests;
          if (cloudData.luggage) luggage = cloudData.luggage;
          if (cloudData.members) members = cloudData.members;
          // Mirror to localStorage as cache
          localSave();
        } catch(e) {}
        updateSyncIndicator('synced');
      } else {
        // Cloud empty/error: fall back to localStorage
        localLoad();
        updateSyncIndicator('offline');
      }
      if (callback) callback();
    });
  } else {
    // No Feishu yet: use localStorage only
    localLoad();
    updateSyncIndicator('offline');
    if (callback) callback();
  }
}

  try {
    localStorage.setItem(localKey('d'), JSON.stringify(dests));
    localStorage.setItem(localKey('l'), JSON.stringify(luggage));
    localStorage.setItem(localKey('m'), JSON.stringify(members));
    localStorage.setItem(localKey('s'), JSON.stringify({ doneItems: S.doneItems, doneLug: S.doneLug, dest: S.dest }));
  } catch(e) {}
}
function localLoad() {
  try {
    var d = localStorage.getItem(localKey('d')); if (d) dests = JSON.parse(d);
    var l = localStorage.getItem(localKey('l')); if (l) luggage = JSON.parse(l);
    var m = localStorage.getItem(localKey('m')); if (m) members = JSON.parse(m);
    var s = localStorage.getItem(localKey('s'));
    if (s) { var p = JSON.parse(s); S.doneItems = p.doneItems||{}; S.doneLug = p.doneLug||{}; if(p.dest&&dests[p.dest]) S.dest = p.dest; }
  } catch(e) {}
  // Validate S.dest — fallback to first valid dest if needed
  var keys = Object.keys(dests);
  if(!S.dest || !dests[S.dest]) {
    S.dest = keys.length ? keys[0] : '';
  }
  // If dest exists but has no places/schedule, still OK — just show overview
}

// ── DRAG TO REORDER SCHEDULE ITEMS ──
var _dragDate=null, _dragPid=null, _dragIdx=-1;

// ── 手机触摸拖动支持 ──
var _touchDragging=false, _touchClone=null, _touchStartY=0, _touchDragEl=null;

document.addEventListener('touchstart', function(e){
  var handle = e.target.closest('.tl-left');
  if(!handle) return;
  var item = handle.closest('.tl-item');
  if(!item) return;
  _touchDragEl = item;
  _touchStartY = e.touches[0].clientY;
  _touchDragging = false;
  // Long-press 150ms to start drag
  handle._touchTimer = setTimeout(function(){
    _touchDragging = true;
    _dragDate = item.dataset.date;
    _dragPid  = item.dataset.pid;
    _dragIdx  = parseInt(item.dataset.idx)||0;
    // Visual clone
    _touchClone = item.cloneNode(true);
    _touchClone.style.cssText = 'position:fixed;left:0;right:0;z-index:9000;opacity:0.85;pointer-events:none;background:var(--bg);box-shadow:0 4px 20px rgba(0,0,0,0.25);';
    _touchClone.style.top = item.getBoundingClientRect().top + 'px';
    document.body.appendChild(_touchClone);
    item.classList.add('dragging');
  }, 150);
},{passive:true});

document.addEventListener('touchmove', function(e){
  if(!_touchDragging || !_touchClone) return;
  e.preventDefault();
  var y = e.touches[0].clientY;
  _touchClone.style.top = (y - 40) + 'px';
  // Find target item under finger
  _touchClone.style.display='none';
  var el = document.elementFromPoint(e.touches[0].clientX, y);
  _touchClone.style.display='';
  var target = el ? el.closest('.tl-item') : null;
  document.querySelectorAll('.tl-item').forEach(function(t){t.classList.remove('drag-over');});
  if(target && target !== _touchDragEl) target.classList.add('drag-over');
},{passive:false});

document.addEventListener('touchend', function(e){
  if(e.target.closest('.tl-left') && e.target.closest('.tl-left')._touchTimer){
    clearTimeout(e.target.closest('.tl-left')._touchTimer);
  }
  if(!_touchDragging){ _touchDragging=false; return; }
  _touchDragging=false;
  if(_touchClone){ _touchClone.remove(); _touchClone=null; }
  document.querySelectorAll('.tl-item').forEach(function(t){
    t.classList.remove('dragging'); t.classList.remove('drag-over');
  });
  // Find drop target
  var y = e.changedTouches[0].clientY;
  var el = document.elementFromPoint(e.changedTouches[0].clientX, y);
  var target = el ? el.closest('.tl-item') : null;
  if(!target || !_dragPid || target === _touchDragEl) return;
  // Reuse existing drop logic
  var fakeE = { preventDefault:function(){}, currentTarget: target };
  tlDrop(fakeE);
},{passive:true});

function tlDragStart(e){
  var el=e.currentTarget||e.target;
  while(el&&!el.dataset.pid) el=el.parentElement;
  if(!el) return;
  _dragDate=el.dataset.date;
  _dragPid=el.dataset.pid;
  _dragIdx=parseInt(el.dataset.idx)||0;
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',_dragPid);
}

function tlDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  var el=e.currentTarget||e.target;
  while(el&&!el.dataset.pid) el=el.parentElement;
  if(el&&el.dataset.pid!==_dragPid){
    document.querySelectorAll('.tl-item').forEach(function(t){t.classList.remove('drag-over');});
    el.classList.add('drag-over');
  }
}

function tlDragEnd(e){
  document.querySelectorAll('.tl-item').forEach(function(t){
    t.classList.remove('dragging');
    t.classList.remove('drag-over');
  });
}

function tlDrop(e){
  e.preventDefault();
  var el=e.currentTarget||e.target;
  while(el&&!el.dataset.pid) el=el.parentElement;
  if(!el||!_dragPid||el.dataset.pid===_dragPid) return;
  
  var targetPid=el.dataset.pid;
  var targetIdx=parseInt(el.dataset.idx)||0;
  var d=D();
  var day=d.schedule.find(function(s){return s.date===_dragDate;});
  if(!day) return;
  
  var ids=day.placeIds.slice();
  var fromIdx=ids.indexOf(_dragPid);
  var toIdx=ids.indexOf(targetPid);
  if(fromIdx<0||toIdx<0) return;
  
  // Collect all segment keys that will be affected
  // Any segment touching fromIdx position (before or after)
  var affectedSegs=[];
  // Segments involving the dragged item's old position
  if(fromIdx>0) affectedSegs.push({f:ids[fromIdx-1],t:_dragPid});
  if(fromIdx<ids.length-1) affectedSegs.push({f:_dragPid,t:ids[fromIdx+1]});
  // Segments around insertion point
  if(toIdx>0) affectedSegs.push({f:ids[toIdx-1],t:targetPid});
  affectedSegs.push({f:_dragPid,t:targetPid});
  // Also 'start' connector for first position
  if(fromIdx===0) affectedSegs.push({f:'start',t:_dragPid});
  if(toIdx===0) affectedSegs.push({f:'start',t:targetPid});
  
  // Clear all affected segment data
  affectedSegs.forEach(function(seg){
    var sk='seg_'+_dragDate+'_'+seg.f+'_'+seg.t;
    var ek='segtp_'+_dragDate+'_'+seg.f+'_'+seg.t;
    delete S.doneItems[sk];
    delete S.doneItems['segcost_'+_dragDate+'_'+seg.f+'_'+seg.t];
    delete S.doneItems['segpay_'+_dragDate+'_'+seg.f+'_'+seg.t];
    d.transport=d.transport.filter(function(t){return t.id!==ek;});
    d.expenses=d.expenses.filter(function(ex){return ex.id!==ek;});
  });
  
  // Reorder
  ids.splice(fromIdx,1);
  var newToIdx=ids.indexOf(targetPid);
  // Insert before or after target based on drag direction
  if(fromIdx<toIdx) ids.splice(newToIdx+1,0,_dragPid);
  else ids.splice(newToIdx,0,_dragPid);
  day.placeIds=ids;
  
  _dragDate=null; _dragPid=null; _dragIdx=-1;
  save(); render();
}

function setSchedDay(i) { S.schedDay=i; render(); }
function setSpecialNote(el){var date=el.dataset.date,pid=el.dataset.pid;S.doneItems['note_'+date+'_'+pid]=el.value;save();}
function setItemCost(el) {
  var date=el.dataset.date, pid=el.dataset.pid;
  S.doneItems['cost_'+date+'_'+pid]=el.value;
  // If transport item, sync back to transport object
  if(pid.indexOf('t_')===0){
    var tp=D().transport.find(function(t){return t.id===pid.slice(2);});
    if(tp) tp.cost=parseFloat(el.value)||0;
  }
  syncItemToExpenses(date, pid);
  save();
}
function syncItemToExpenses(date, pid) {
  var expId='sched_'+date+'_'+pid;
  var d=D();
  var costVal=parseFloat(S.doneItems['cost_'+date+'_'+pid])||0;
  var payer=S.doneItems['payer_'+date+'_'+pid]||''; // '' = unassigned, 'self' = split
  var existing=d.expenses.find(function(e){return e.id===expId;});
  if(costVal>0) { // Always add to expenses (unassigned shows red, self shows as 各自)
    var isR=pid.indexOf('r_')===0, isT=pid.indexOf('t_')===0;
    var item=isR?d.restaurants.find(function(r){return 'r_'+r.id===pid;})
              :isT?d.transport.find(function(t){return 't_'+t.id===pid;})
              :d.places.find(function(p){return p.id===pid;});
    var name=item?(item.cn||item.name||pid):pid;
    var cat=isR?'m':isT?'x':'t';
    // payer '' = unassigned (show red in budget), not defaulted to first member
    if(existing){existing.amount=costVal;existing.payer=payer;existing.cn=name;existing.en=name;existing.cat=cat;}
    else{d.expenses.push({id:expId,cat:cat,cn:name,en:name,amount:costVal,payer:payer,split:'all',date:date});}
  } else if(payer==='self'){
    var isR2=pid.indexOf('r_')===0,isT2=pid.indexOf('t_')===0;
    var item2=isR2?d.restaurants.find(function(r){return 'r_'+r.id===pid;})
              :isT2?d.transport.find(function(t){return 't_'+t.id===pid;})
              :d.places.find(function(p){return p.id===pid;});
    var name2=item2?(item2.cn||item2.name||pid):pid;
    var cat2=isR2?'m':isT2?'x':'t';
    if(existing){existing.amount=costVal;existing.payer='self';}
    else if(costVal>0){d.expenses.push({id:expId,cat:cat2,cn:name2,en:name2,amount:costVal,payer:'self',split:'all',date:date});}
  }
  // If costVal=0, keep existing record but update payer
  if(costVal===0 && existing) d.expenses=d.expenses.filter(function(e){return e.id!==expId;});
}
function setItemPayer(el) {
  var date=el.dataset.date, pid=el.dataset.pid;
  S.doneItems['payer_'+date+'_'+pid]=el.value;
  // If transport item, sync payer to transport object too
  if(pid.indexOf('t_')===0){
    var tp=D().transport.find(function(t){return t.id===pid.slice(2);});
    if(tp) tp.payer=el.value;
  }
  syncItemToExpenses(date, pid);
  save();
}
function setItemTime(el) {
  var date = el.dataset.date;
  var pid  = el.dataset.pid;
  var type = el.dataset.type;
  var val  = el.value.trim();
  // Validate HH:MM format
  el.style.borderColor='';el.title='';
  // Validate: dep must not be earlier than arr
  if(type==='dep' && val) {
    var arrKey = 'arr_'+date+'_'+pid;
    var arr = S.doneItems[arrKey]||'';
    if(arr && val < arr) {
      el.style.borderColor = 'var(--err)';
      el.title = LANG==='zh'?'离开时间不能早于到达时间':'Departure cannot be before arrival';
      return; // reject
    }
  }
  if(type==='arr' && val) {
    var depKey = 'dep_'+date+'_'+pid;
    var dep = S.doneItems[depKey]||'';
    if(dep && val > dep) {
      // arrival is after departure - clear departure
      S.doneItems[depKey] = '';
    }
  }
  el.style.borderColor = '';
  el.title = '';
  S.doneItems[type+'_'+date+'_'+pid] = val;
  save();

    +members.map(function(m){return'<option value="'+m.id+'">'+m.name+'</option>';}).join('');

    var so = '<option value="all"'+(e.split==='all'?' selected':'')+'>'+(LANG==='zh'?'平摊':'All')+'</option>'
      +members.map(function(m){return'<option value="'+m.id+'"'+(e.split===m.id?' selected':'')+'>'+m.name+'</option>';}).join('');
        var cat_lbl={f:LANG==='zh'?'机票':'Flight',h:LANG==='zh'?'住宿':'Hotel',m:LANG==='zh'?'餐饮':'Food',t:LANG==='zh'?'門票':'Ticket',x:LANG==='zh'?'交通':'Transit'};

    : '<div class="settle-card"><div class="settle-ok">'+ico('check',16,'var(--red)')+' '+(LANG==='zh'?'账目已平衡':'All settled')+'</div></div>';

  // members
  var memberHtml = '<div class="budget-members">'
    +members.map(function(m,mi){

// ── PICKER ──
function renderPickerList() {
  var d = D();
  var cat = S.pickerCat || 'places';
  var cats = [
    {k:'places',   zh:'景点',  en:'Sights'},
    {k:'food',     zh:'餐饮',  en:'Food'},
    {k:'stay',     zh:'住宿',  en:'Stay'},
  ];
  var catBar = '<div style="display:flex;border-bottom:1px solid var(--hair)">'
    +cats.map(function(c){
      var a=c.k===cat;
      return '<button onclick="setPickerCat(this.dataset.k)" data-k="'+c.k+'" style="flex:1;padding:10px 4px;background:none;border:none;border-bottom:2px solid '+(a?'var(--red)':'transparent')+';font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:'+(a?'var(--red)':'var(--muted)')+';cursor:pointer">'+(LANG==='zh'?c.zh:c.en)+'</button>';
    }).join('')
    +'</div>';
  var items = '';
  if(cat==='places') {
    items = d.places.map(function(p){
      var sel=S.pickerSel.indexOf(p.id)>=0;
      var name=pn(p); var sub=(LANG==='zh'?p.en:p.cn)+(p.area?' · '+p.area:'');
      var dist=p.kh>0?(p.kh+'km · ~'+p.min+'min'):'';
      return '<div class="picker-item'+(sel?' sel':'')+'" onclick="tglPicker(this.dataset.pid)" data-pid="'+p.id+'">'
        +'<div class="pi-circ"><span class="pi-tick">&#x2713;</span></div>'
        +'<div style="flex:1"><div class="pi-name">'+name+'</div><div class="pi-sub">'+sub+'</div></div>'
        +(dist?'<div class="pi-dist">'+dist+'</div>':'')+'</div>';
    }).join('') || '<div style="padding:20px 22px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px">'+(LANG==='zh'?'先在准备>景点添加':'Add in Prepare > Sights')+'</div>';
  // Always show 'go to places' button at bottom
  items += '<div style="padding:8px 22px;border-top:1px solid var(--hair)"><button onclick="closePicker();goFlow(\'prepare\',\'places\')" style="font-family:var(--mono);font-size:10px;padding:6px 14px;color:var(--red);border:1px solid var(--red);background:transparent;cursor:pointer">'+(LANG==='zh'?'前往添加景点 →':'Go to places →')+'</button></div>';
  } else if(cat==='food') {
    items = d.restaurants.map(function(r){
      var sel=S.pickerSel.indexOf('r_'+r.id)>=0;
      var name=LANG==='zh'?r.cn:r.en;
      return '<div class="picker-item'+(sel?' sel':'')+'" onclick="tglPicker(this.dataset.pid)" data-pid="r_'+r.id+'">'
        +'<div class="pi-circ"><span class="pi-tick">&#x2713;</span></div>'
        +'<div style="flex:1"><div class="pi-name">'+name+'</div>'+(r.loc?'<div class="pi-sub">'+r.loc+'</div>':'')+'</div>'
        +'<div class="pi-dist">🍜</div></div>';
    }).join('') || '<div style="padding:20px 22px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px">'+(LANG==='zh'?'先在更多>餐饮添加':'Add in More > Food')+'</div>';
    // Quick add new restaurant
    items += '<div style="padding:12px 22px;border-top:1px solid var(--hair);background:var(--bg)">'
      +'<div style="font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--red);margin-bottom:8px;text-transform:uppercase">'+(LANG==='zh'?'新增餐厅':'New restaurant')+'</div>'
      +'<div style="display:flex;gap:8px">'
      +'<input id="pickerFoodName" style="flex:1;font-family:var(--sans);font-size:14px;padding:8px 10px;border:1px solid var(--hair2);background:var(--card);color:var(--ink)" placeholder="'+(LANG==="zh"?"餐厅名称":"Restaurant name")+'">'
      +'<button style="padding:8px 14px;background:var(--red);color:white;border:none;font-family:var(--mono);font-size:12px;cursor:pointer;flex-shrink:0" onclick="pickerAddFood()">+</button>'
      +'</div></div>';
  } else if(cat==='stay') {
    var _pickDay=S.pickerDay||'';
    var _dayHotels=d.hotels.filter(function(h){
      if(!_pickDay) return true; // no day filter
      var ci=h.cin||h.checkin||'', co=h.cout||h.checkout||'';
      if(!ci||!co) return true; // no dates set yet, show anyway
      return _pickDay>=ci && _pickDay<co; // covers this night
    });
    items=_dayHotels.map(function(h){
      var hpid='h_'+h.id;
      var sel=S.pickerSel.indexOf(hpid)>=0;
      var cin=h.cin||h.checkin||'',cout=h.cout||h.checkout||'';
      return '<div class="picker-item'+(sel?' sel':'')+'" onclick="tglPicker(this.dataset.pid)" data-pid="'+hpid+'">'
        +'<div class="pi-circ"><span class="pi-tick">&#x2713;</span></div>'
        +'<div style="flex:1"><div class="pi-name">'+hn(h)+'</div>'
        +(cin?'<div class="pi-sub">'+fmtDate(cin)+' → '+fmtDate(cout)+'</div>':'')
        +'</div><div class="pi-dist">🏨</div></div>';
    }).join('')||'<div style="padding:20px 22px">'
      +'<div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;margin-bottom:12px">'+(LANG==='zh'?'暂无匹配住宿':'No hotels for this day')+'</div>'
      +'<button onclick="closePicker();goFlow(\'prepare\',\'stay\')" style="font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:8px 16px;background:var(--red);color:white;border:none;cursor:pointer">'+(LANG==="zh"?"前往添加住宿 →":"Add hotels →")+'</button>'
      +'</div>'
  }
  document.getElementById('pickerList').innerHTML = catBar + items;
}

function updHotel(el){
  var d=D();
  var h=d.hotels.find(function(h){return h.id===el.dataset.hid;});
  if(!h)return;
  var f=el.dataset.field,val=el.value;
  var cin=h.cin||h.checkin||'',cout=h.cout||h.checkout||'';
  if(f==='cout'&&val&&cin&&val<=cin){
    el.style.borderColor='var(--err)';
    el.style.boxShadow='0 0 0 2px rgba(181,70,42,0.3)';
    el.title=LANG==='zh'?'退房日期不能早于或等于入住日期！':'Check-out must be after check-in!';
    setTimeout(function(){el.style.boxShadow='';},2000);
    return;
  }
  el.style.borderColor='';
  if(f==='cin'){h.cin=val;delete h.checkin;}
  if(f==='cout'){h.cout=val;delete h.checkout;}
  // Update budget expense name with new nights count
  var newCin=h.cin||h.checkin||'', newCout=h.cout||h.checkout||'';
  if(newCin&&newCout&&newCout>newCin){
    var _n=nightsBetween(newCin,newCout);
    var _nm=(h.cn||h.en)+' '+(LANG==='zh'?_n+'晚':_n+' nights');
    var _exp=d.expenses.find(function(e){return e.id==='hotel_'+h.id;});
    if(_exp){_exp.cn=_nm;_exp.en=_nm;}
  }
  save();render();
}
