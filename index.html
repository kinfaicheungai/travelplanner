<style>
/* ============ WASHI DESIGN SYSTEM · 京都和纸 ============ */
:root {
  --bg:    #F5F1EA;
  --bg2:   #EBE5DA;
  --bg3:   #E0D8CC;
  --ink:   #1A1A1A;
  --ink2:  #3A3A3A;
  --muted: #7A7268;
  --hair:  rgba(26,26,26,0.10);
  --hair2: rgba(26,26,26,0.18);
  --red:   #B5462A;
  --redD:  #8C2E1A;
  --redL:  rgba(181,70,42,0.08);
  --card:  #FFFFFF;
  --err:   #B5462A;
  --errbg: rgba(181,70,42,0.06);
  --serif-jp: "Noto Serif JP","Cormorant Garamond",serif;
  --serif:    "Instrument Serif","Cormorant Garamond",serif;
  --sans:     "Noto Sans JP",-apple-system,system-ui,sans-serif;
  --mono:     "JetBrains Mono",ui-monospace,monospace;
}
/* Washi is a paper/light theme — dark mode not applied */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px}

/* ── SHELL ── */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}

/* ── PAPER GRAIN (background texture) ── */
.grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 18% 8%, rgba(181,70,42,0.035) 0,transparent 42%),
    repeating-linear-gradient(0deg,rgba(0,0,0,0.011) 0 1px,transparent 1px 3px);
}

/* ── STATUS BAR SPACER ── */
.sb{height:env(safe-area-inset-top,0px);background:var(--bg);position:relative;z-index:10}

/* ── TOP CHROME ── */
.chrome{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px 8px;
  background:var(--bg);
  border-bottom:1px solid var(--hair);
  position:relative;z-index:10;flex-shrink:0;
}
.logo-wrap{display:flex;align-items:center;gap:10px}
.hanko{
  width:30px;height:30px;background:var(--red);color:var(--bg);
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif-jp);font-weight:700;font-size:16px;
  transform:rotate(-3deg);flex-shrink:0;
}
.logo-name{font-family:var(--serif);font-size:15px;font-style:italic;line-height:1;color:var(--ink)}
.logo-sub{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:1.5px;margin-top:2px}
.chrome-right{display:flex;align-items:center;gap:10px}
.lang-pill{
  font-family:var(--mono);font-size:9px;letter-spacing:1.5px;
  padding:4px 9px;border:1px solid var(--hair2);background:transparent;
  color:var(--muted);cursor:pointer;text-transform:uppercase;
}
.lang-pill:active{background:var(--bg2)}
.user-pill{
  display:flex;align-items:center;gap:6px;
  padding:3px 8px 3px 3px;border:1px solid var(--hair2);cursor:pointer;
}
.user-pip{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:500;color:white;flex-shrink:0}
.user-nm{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.sync-pip{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sync-pip.synced{background:var(--red)}
.sync-pip.syncing{background:#C4891C;animation:pulse 1s infinite}
.sync-pip.offline{background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── DEST CHIPS ── */
.dest-scroll{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--hair);flex-shrink:0;position:relative;z-index:10;background:var(--bg)}
.dest-scroll::-webkit-scrollbar{display:none}
.dest-chip{
  padding:9px 18px;font-family:var(--mono);font-size:9px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;
  background:transparent;border-top:none;border-left:none;border-right:none;
  transition:color 0.15s;flex-shrink:0;
}
.dest-chip.active{color:var(--red);border-bottom-color:var(--red)}
.dest-chip.add{border-bottom-color:transparent;color:var(--muted);border-bottom-style:dashed}
.dest-chip-x{font-size:13px;opacity:0.5}

/* ── TAB BAR (bottom) ── */
.tabbar{
  display:flex;border-top:1px solid var(--hair);background:var(--bg);
  flex-shrink:0;position:relative;z-index:10;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 8px;background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);transition:color 0.15s;
}
.tab-btn.active{color:var(--red)}
.tab-btn svg{transition:opacity 0.15s}
.tab-btn.active svg{opacity:1}

/* ── BODY SCROLL ── */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:1}

/* ── COMMON COMPONENTS ── */
.page-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 22px 10px;
  border-bottom:1px solid var(--hair);
}
.page-title-jp{font-family:var(--serif-jp);font-size:16px;font-weight:500;letter-spacing:4px;color:var(--ink)}
.red-rule{height:2px;background:var(--red);margin:0 22px}
.section-label{
  font-family:var(--mono);font-size:9px;letter-spacing:2px;
  color:var(--red);text-transform:uppercase;
}
.section-label-jp{font-family:var(--serif-jp);font-size:11px;color:var(--muted)}
.hair-line{height:1px;background:var(--hair)}

/* Forms */
.f-label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.f-inp{
  width:100%;padding:11px 13px;
  border:1px solid var(--hair2);background:var(--card);
  color:var(--ink);font-size:15px;font-family:var(--sans);
  -webkit-appearance:none;transition:border-color 0.15s;
}
.f-inp:focus{outline:none;border-color:var(--red)}
.f-inp.err{border-color:var(--err);background:var(--errbg)}
.f-inp::placeholder{color:var(--muted);font-size:13px}
.f-sel{
  width:100%;padding:11px 10px;
  border:1px solid var(--hair2);background:var(--card);
  color:var(--ink);font-size:14px;font-family:var(--sans);-webkit-appearance:none;
}
.f-group{display:flex;flex-direction:column;margin-bottom:14px}
.req{color:var(--red)}
.btn-red{
  width:100%;padding:14px;background:var(--red);border:none;
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--bg);cursor:pointer;
}
.btn-red:active{background:var(--redD)}
.btn-ghost{
  width:100%;padding:12px;background:transparent;
  border:1px solid var(--hair2);
  font-family:var(--mono);font-size:9px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);cursor:pointer;
}
.btn-ghost:active{background:var(--bg2)}
.del-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:4px 8px;line-height:1}
.del-btn:active{color:var(--red)}
.err-tip{font-family:var(--mono);font-size:9px;color:var(--err);margin-top:4px;letter-spacing:0.5px}
.info-band{
  border-left:2px solid var(--red);background:var(--redL);
  padding:10px 14px;font-size:13px;color:var(--ink2);line-height:1.6;
  margin-bottom:12px;
}
.warn-band{
  border-left:2px solid #C4891C;background:rgba(196,137,28,0.07);
  padding:10px 14px;font-size:13px;color:var(--ink2);line-height:1.6;
  margin-bottom:12px;
}

/* ── OVERVIEW ── */
.ov-hero{display:flex;padding:28px 22px 20px;align-items:flex-start;gap:16px}
.ov-vert{writing-mode:vertical-rl;font-family:var(--serif-jp);font-size:38px;font-weight:500;line-height:1;letter-spacing:6px;color:var(--ink);flex-shrink:0}
.ov-headline{flex:1;padding-top:4px}
.ov-mono{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--red);margin-bottom:10px}
.ov-serif-big{font-family:var(--serif);font-size:40px;font-weight:400;line-height:0.95;letter-spacing:-1.5px}
.ov-serif-it{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink2);margin-top:2px;letter-spacing:-0.5px}
.ov-dates{font-family:var(--serif-jp);font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7}
.ov-index{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:22px}
.stat-row{display:flex;align-items:baseline;gap:14px;padding:14px 22px;border-top:1px solid var(--hair)}
.stat-row:last-child{border-bottom:1px solid var(--hair)}
.stat-n{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--red);width:28px;font-weight:400}
.stat-label{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--muted)}
.stat-v{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-1px}
.stat-u{font-size:13px;color:var(--muted);margin-left:4px;font-family:var(--serif-jp)}
.upnext-card{margin:0 22px 24px;background:var(--card);border:1px solid var(--hair)}
.upnext-img{height:130px;background:repeating-linear-gradient(45deg,var(--bg2) 0 8px,var(--bg) 8px 16px);position:relative;overflow:hidden}
.img-label{position:absolute;top:8px;left:10px;font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--muted)}

}

/* ── STAY ── */

/* ── FOOD ── */

.food-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.5px;margin-top:3px}
.food-tag{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;padding:3px 8px;background:var(--redL);color:var(--red);text-transform:uppercase;flex-shrink:0}

.food-add{padding:14px 22px;border-top:1px solid var(--hair);background:var(--bg2)}

/* ── LUGGAGE ── */
.lug-item{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--hair);cursor:pointer}
.lug-item:active{background:var(--bg2)}

.lug-item.chk .lug-box{background:var(--red);border-color:var(--red)}
.lug-tick{font-size:10px;color:var(--bg);display:none;font-weight:700}

.lug-item.chk .lug-label{text-decoration:line-through;color:var(--muted)}

.lug-add{padding:14px 22px;border-top:1px solid var(--hair);background:var(--bg2);display:flex;gap:8px}

/* ── BUDGET ── */
.budget-total{padding:20px 22px 14px}

.total-per{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);margin-top:8px}
.settle-card{margin:0 22px 18px;background:var(--card);border:1px solid var(--hair);padding:20px}
.settle-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.settle-mono{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted)}

.settle-row{display:flex;align-items:baseline;gap:8px}

.exp-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--hair)}
.exp-item:last-child{border-bottom:1px solid var(--hair)}

.paid-row{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--hair)}
.paid-bar-wrap{flex:1;height:2px;background:var(--hair2);overflow:hidden}
.paid-bar-fill{height:100%}
.paid-name{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--ink2);min-width:36px;text-transform:uppercase}

.paid-status{font-family:var(--mono);font-size:9px;letter-spacing:0.5px;min-width:80px;text-align:right}
.budget-members{padding:16px 22px;border-bottom:1px solid var(--hair);display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.m-card{display:flex;flex-direction:column;align-items:center;gap:4px}

.exp-add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.currency-row{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--hair)}

/* ── LOGIN ── */
.login-screen{
  position:fixed;inset:0;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;padding:40px 28px calc(env(safe-area-inset-bottom,0px)+32px);
  gap:0;
}
.login-hanko{
  width:56px;height:56px;background:var(--red);color:var(--bg);
  border-radius:6px;display:flex;align-items:center;justify-content:center;

}
.login-wordmark{font-family:var(--serif);font-size:32px;color:var(--bg);letter-spacing:2px;font-style:italic;margin-bottom:4px}
.login-sig{font-family:'Dancing Script','Brush Script MT',cursive;font-size:16px;color:#E87A5A;opacity:0.9;margin-bottom:6px}
.login-tagline{font-family:var(--mono);font-size:8.5px;color:rgba(245,241,234,0.35);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:40px}
.login-card{width:100%;max-width:340px;border:1px solid rgba(255,255,255,0.15);padding:28px 24px;border-radius:4px}
.login-field-label{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:rgba(245,241,234,0.5);text-transform:uppercase;margin-bottom:8px;text-align:center}
.login-inp{
  width:100%;padding:16px;background:rgba(255,255,255,0.08);
  border:1.5px solid rgba(255,255,255,0.35);
  font-family:var(--mono);font-size:22px;font-weight:500;
  color:#F5F1EA;letter-spacing:0.2em;text-align:center;text-transform:uppercase;
  -webkit-appearance:none;margin-bottom:14px;
}
.login-inp::placeholder{color:rgba(240,235,227,0.2);font-size:12px;font-weight:400;text-transform:none;letter-spacing:0.05em}

.login-inp.err{border-color:#E87A5A;animation:shake 0.35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.login-btn{
  width:100%;padding:15px;background:var(--red);border:none;

  text-transform:uppercase;color:var(--bg);cursor:pointer;
}
.login-btn:active{background:var(--redD)}
.login-btn.loading{opacity:0.6;pointer-events:none}
.login-err{font-family:var(--mono);font-size:9px;color:var(--red);text-align:center;margin-top:10px;min-height:18px;letter-spacing:0.5px}
.login-demo-btn{display:block;width:100%;text-align:center;margin-top:14px;font-family:var(--mono);font-size:9px;color:rgba(245,241,234,0.4);background:none;border:none;cursor:pointer;letter-spacing:1.5px;text-decoration:underline;text-transform:uppercase;padding:4px}
.login-footer{margin-top:24px;font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;opacity:0.5;text-align:center}

/* ── ICONS (inline SVG helper) ── */
.ico{display:block;flex-shrink:0}

  return d.hotels.find(function(h){return h.checkin&&h.checkout&&dateStr>=h.checkin&&dateStr<h.checkout;})||null;

// Returns ALL hotels covering a date (handles rare multi-hotel same day)
function hotelsForDate(dateStr){
  var d=D();if(!d.hotels)return[];
  return d.hotels.filter(function(h){return h.checkin&&h.checkout&&dateStr>=h.checkin&&dateStr<h.checkout;});
}
function hotelsOverlap(hotels){
  for(var i=0;i<hotels.length;i++){
    for(var j=i+1;j<hotels.length;j++){
      var a=hotels[i],b=hotels[j];
      if(!a.checkin||!a.checkout||!b.checkin||!b.checkout)continue;
      if(a.checkin<b.checkout&&b.checkin<a.checkout)return true;
    }
  }
  return false;
}

function buildDays(){
  var d=D();if(!d.start||!d.end)return[];
  var days=[],cur=new Date(d.start+'T12:00:00'),end=new Date(d.end+'T12:00:00');
  while(cur<end){
    var ds=cur.toISOString().slice(0,10);
    var ex=d.schedule.find(function(s){return s.date===ds;});
    if(!ex){ex={date:ds,placeIds:[]};d.schedule.push(ex);}
    days.push(ex);cur.setDate(cur.getDate()+1);
  }
  return days;
}
function setDates(){
  var s=document.getElementById('dstart').value,e=document.getElementById('dend').value;

  if(!e){ee.classList.add('err');ok=false;}
  if(!ok)return;
  if(s>=e){alert(LANG==='zh'?'结束日期必须晚于开始日期':'End must be after start');return;}

}

function setCurrency(v){D().currency=v;save();render();}
function calcBal(){
  var bal={};members.forEach(function(m){bal[m.id]=0;});
  D().expenses.forEach(function(e){
    var sm=e.split==='all'?members.map(function(m){return m.id;}):[e.split];
    var sh=e.amount/sm.length;
    bal[e.payer]=(bal[e.payer]||0)+e.amount;
    sm.forEach(function(id){bal[id]=(bal[id]||0)-sh;});
  });
  return bal;
}
function calcSettle(bal){
  var pos=[],neg=[];
  Object.keys(bal).forEach(function(id){
    var v=bal[id];var m=members.find(function(m){return m.id===id;});if(!m)return;
    if(v>0.5)pos.push({name:m.name,col:m.col,amt:v});
    else if(v<-0.5)neg.push({name:m.name,col:m.col,amt:-v});
  });
  var txns=[],pp=pos.map(function(x){return{name:x.name,col:x.col,amt:x.amt};}),nn=neg.map(function(x){return{name:x.name,col:x.col,amt:x.amt};});
  while(pp.length&&nn.length){var g=nn[0],r=pp[0],a=Math.min(g.amt,r.amt);txns.push({from:g,to:r,amt:a});g.amt-=a;r.amt-=a;if(g.amt<0.5)nn.shift();if(r.amt<0.5)pp.shift();}
  return txns;
}

// ---- LOAD USER DATA ----
function loadUserData(callback) {
  // Phase 1: try Feishu cloud
  if (FEISHU_CONFIG.app_id && currentUser.feishuSheet) {
    updateSyncIndicator('syncing');
    feishuLoad(function(cloudData) {
      if (cloudData) {
        // Cloud data wins — load it
        try {
          if (cloudData.dests) dests = cloudData.dests;
          if (cloudData.luggage) luggage = cloudData.luggage;
          if (cloudData.members) members = cloudData.members;
          // Mirror to localStorage as cache
          localSave();
        } catch(e) {}
        updateSyncIndicator('synced');
      } else {
        // Cloud empty/error: fall back to localStorage
        localLoad();
        updateSyncIndicator('offline');
      }
      if (callback) callback();
    });
  } else {
    // No Feishu yet: use localStorage only
    localLoad();
    updateSyncIndicator('offline');
    if (callback) callback();
  }
}

// ---- LOCAL STORAGE (namespaced by invite code) ----
function localKey(k) {
  return 'wp4_' + (currentUser ? currentUser.code : 'DEMO') + '_' + k;
}
function localSave() {
  try {
    localStorage.setItem(localKey('d'), JSON.stringify(dests));
    localStorage.setItem(localKey('l'), JSON.stringify(luggage));
    localStorage.setItem(localKey('m'), JSON.stringify(members));
    localStorage.setItem(localKey('s'), JSON.stringify({ doneItems: S.doneItems, doneLug: S.doneLug, dest: S.dest }));
  } catch(e) {}
}
function localLoad() {
  try {
    var d = localStorage.getItem(localKey('d')); if (d) dests = JSON.parse(d);
    var l = localStorage.getItem(localKey('l')); if (l) luggage = JSON.parse(l);
    var m = localStorage.getItem(localKey('m')); if (m) members = JSON.parse(m);
    var s = localStorage.getItem(localKey('s'));
    if (s) { var p = JSON.parse(s); S.doneItems = p.doneItems||{}; S.doneLug = p.doneLug||{}; if(p.dest&&dests[p.dest]) S.dest = p.dest; }
  } catch(e) {}
  // Validate S.dest — fallback to first valid dest if needed
  var keys = Object.keys(dests);
  if(!S.dest || !dests[S.dest]) {
    S.dest = keys.length ? keys[0] : '';
  }
  // If dest exists but has no places/schedule, still OK — just show overview
}

// ── SEGMENT TRANSPORT HELPERS ──
function getSegmentMode(date,from,to){return S.doneItems['seg_'+date+'_'+from+'_'+to]||'';}
function setSegmentCost(el){
  var date=el.dataset.date,from=el.dataset.from,to=el.dataset.to;
  var key='segcost_'+date+'_'+from+'_'+to;
  S.doneItems[key]=el.value;
  // Sync cost to transport list entry
  var d=D(),segKey='segtp_'+date+'_'+from+'_'+to;
  var tp=d.transport.find(function(t){return t.id===segKey;});
  if(tp){tp.cost=parseFloat(el.value)||0;}
  save();
}
function setSegmentMode(el){
  var date=el.dataset.date,from=el.dataset.from,to=el.dataset.to,mode=el.value||el.dataset.mode;
  var key='seg_'+date+'_'+from+'_'+to;
  S.doneItems[key] = mode;
  // Add to transport list
  var d=D(),segKey='segtp_'+date+'_'+from+'_'+to;
  var icons={walk:'🚶',metro:'🚇',taxi:'🚕',bus:'🚌',rental:'🚗',other:'🚐'};
  var fromItem=d.places.find(function(x){return x.id===from;})||d.restaurants.find(function(x){return 'r_'+x.id===from;});
  var toItem=d.places.find(function(x){return x.id===to;})||d.restaurants.find(function(x){return 'r_'+x.id===to;});
  var fromN=fromItem?(fromItem.cn||fromItem.name):'?';
  var toN=toItem?(toItem.cn||toItem.name):'?';
  if(S.doneItems[key]&&!d.transport.find(function(t){return t.id===segKey;})){
    d.transport.push({id:segKey,type:mode==='taxi'?'rideshare':mode==='metro'?'train':mode,
      cn:(icons[mode]||'>')+' '+fromN+' → '+toN,en:(icons[mode]||'>')+' '+fromN+' → '+toN,
      detail:mode,date:date,cost:0});
  } else if(!S.doneItems[key]){
    d.transport=d.transport.filter(function(t){return t.id!==segKey;});
  }
  save();render();
}

      +'<div class="tl-no" style="color:'+kindCol+'">'+nNum+'</div>'
      +'</div>'
      +'<div class="tl-right">'
      +'<div class="tl-kind" onclick="tglSchedItem(this.dataset.date,this.dataset.pid)" data-date="'+day.date+'" data-pid="'+pid+'" style="cursor:pointer">'

      +(itemSub&&itemSub!==itemName?'<div class="tl-sub">'+itemSub+'</div>':'')
      +(itemDist?'<div class="tl-dist">'+itemDist+'</div>':'')

      +'</div>';

  });
  // Build connector rows between items

  var _mOpts=['walk','metro','taxi','bus','rental','other'].map(function(_m){

              metro:LANG==='zh'?'🚇 地铁':'🚇 Metro',

function setSchedDay(i) { S.schedDay=i; render(); }
function setItemCost(el) {
  var date=el.dataset.date, pid=el.dataset.pid;
  var costKey='cost_'+date+'_'+pid;
  S.doneItems[costKey]=el.value;
  // Sync to expenses
  var expId='sched_'+date+'_'+pid;
  var d=D();
  var existing=d.expenses.find(function(e){return e.id===expId;});
  if(el.value&&parseFloat(el.value)>0){
    var payKey='payer_'+date+'_'+pid;
    var payer=S.doneItems[payKey]||(members[0]?members[0].id:'');
    if(existing){existing.amount=parseFloat(el.value);existing.payer=payer;}
    else{
      // Determine item name
      var pid2=pid;
      var isR=pid2.indexOf('r_')===0,isT=pid2.indexOf('t_')===0;
      var name=isR?(d.restaurants.find(function(r){return 'r_'+r.id===pid2;})||{}).cn||pid2
               :isT?(d.transport.find(function(t){return 't_'+t.id===pid2;})||{}).cn||pid2
               :(d.places.find(function(p){return p.id===pid2;})||{}).cn||pid2;
      d.expenses.push({id:expId,cat:'t',cn:name,en:name,amount:parseFloat(el.value),payer:payer,split:'all'});
    }
  } else if(existing){
    d.expenses=d.expenses.filter(function(e){return e.id!==expId;});
  }
  save();
}
function setItemPayer(el) {
  var date=el.dataset.date, pid=el.dataset.pid;
  S.doneItems['payer_'+date+'_'+pid]=el.value;
  var expId='sched_'+date+'_'+pid;
  var existing=D().expenses.find(function(e){return e.id===expId;});
  if(existing) existing.payer=el.value;
  save();
}
function setItemTime(el) {
  var date = el.dataset.date;
  var pid  = el.dataset.pid;
  var type = el.dataset.type;
  S.doneItems[type+'_'+date+'_'+pid] = el.value;
  save();
  // Update just the time display in left column - find sibling
  var item = el.closest('.tl-item');
  if(item && type==='arr') {
    var timeEl = item.querySelector('.tl-time');
    if(timeEl) timeEl.innerHTML = el.value 
      ? '<span style="font-size:10px;font-weight:600;line-height:1.3">'+el.value+'</span>' 
      : '';
  }
}

function rTransport() {

// ── BUDGET ──
function rBudget() {
  var d = D(); var exps = d.expenses;
  var bal = calcBal(); var txns = calcSettle(bal);
  var total = exps.reduce(function(s,e){return s+e.amount;},0);
  var cur = getCurrency();
  var curSym = cur==='CNY'?'¥':cur==='JPY'?'J¥':cur==='HKD'?'HK$':cur==='AUD'?'A$':cur==='EUR'?'€':cur==='GBP'?'£':cur==='SGD'?'SG$':'$';
  var half = total/Math.max(1,members.length);
  var CURRENCIES = ['HKD','CNY','AUD','USD','EUR','GBP','JPY','SGD'];
  var curOpts = CURRENCIES.map(function(c){return'<option value="'+c+'"'+(c===cur?' selected':'')+'>'+c+'</option>';}).join('');
  var payerOpts = members.map(function(m){return'<option value="'+m.id+'">'+m.name+'</option>';}).join('');
  var splitOpts = '<option value="all">'+(LANG==='zh'?'平摊':'All')+'</option>'
    +members.map(function(m){return'<option value="'+m.id+'">'+m.name+'</option>';}).join('');

  // expense list
  var expItems = exps.map(function(e){
    var po = members.map(function(m){return'<option value="'+m.id+'"'+(m.id===e.payer?' selected':'')+'>'+m.name+'</option>';}).join('');
    var so = '<option value="all"'+(e.split==='all'?' selected':'')+'>'+(LANG==='zh'?'平摊':'All')+'</option>'
      +members.map(function(m){return'<option value="'+m.id+'"'+(e.split===m.id?' selected':'')+'>'+m.name+'</option>';}).join('');
    var ico_map = {f:'✈️',h:'🏨',m:'🍜',t:'🎟️',x:'🚇'};
    return '<div class="exp-item">'
      +'<div class="exp-date">'+(ico_map[e.cat]||'•')+'</div>'
      +'<div style="flex:1">'
      +'<div class="exp-name">'+(LANG==='zh'?e.cn:e.en)+'</div>'
      +'<div class="exp-controls">'
      +'<input class="exp-amt-inp" type="number" value="'+e.amount+'" onchange="chgAmt('+e.id+',this.value)" placeholder="0">'
      +'<select class="exp-sel" onchange="chgPayer('+e.id+',this.value)">'+po+'</select>'
      +'<select class="exp-sel" onchange="chgSplit('+e.id+',this.value)">'+so+'</select>'
      +'<select class="exp-sel" id="ec_'+e.id+'">'
      +'<option value="m"'+(e.cat==='m'?' selected':'')+'>🍜</option>'
      +'<option value="f"'+(e.cat==='f'?' selected':'')+'>✈️</option>'
      +'<option value="h"'+(e.cat==='h'?' selected':'')+'>🏨</option>'
      +'<option value="t"'+(e.cat==='t'?' selected':'')+'>🎟️</option>'
      +'<option value="x"'+(e.cat==='x'?' selected':'')+'>🚇</option>'
      +'</select>'
      +'</div></div>'
      +'<button class="del-btn" onclick="delExp('+e.id+')">&#xD7;</button>'
      +'</div>';
  }).join('');

  // who paid rows
  var maxPaid = Math.max(1,Math.max.apply(null,members.map(function(m){
    return exps.filter(function(e){return e.payer===m.id;}).reduce(function(s,e){return s+e.amount;},0);
  })));
  var paidRows = members.map(function(m){
    var paid = exps.filter(function(e){return e.payer===m.id;}).reduce(function(s,e){return s+e.amount;},0);
    var b = bal[m.id]||0;
    var bStr = b>0.5?(LANG==='zh'?'收回 ':'Gets ')+curSym+Math.round(b)
      :b<-0.5?(LANG==='zh'?'应付 ':'Owes ')+curSym+Math.round(-b)
      :(LANG==='zh'?'✓ 已平':'✓ OK');
    var bCol = b>0.5?'var(--red)':b<-0.5?'#8C5A00':'var(--muted)';
    return '<div class="paid-row">'
      +'<div class="paid-name">'+m.name+'</div>'
      +'<div class="paid-bar-wrap"><div class="paid-bar-fill" style="width:'+(paid/maxPaid*100)+'%;height:100%;background:'+m.col.bg+';border-right:2px solid '+m.col.tx+'"></div></div>'
      +'<div class="paid-paid">'+curSym+Math.round(paid).toLocaleString()+'</div>'
      +'<div class="paid-status" style="color:'+bCol+'">'+bStr+'</div>'
      +'</div>';
  }).join('');

  // settle
  var settleHtml = txns.length
    ? '<div class="settle-card">'
      +'<div class="settle-hdr"><div class="settle-mono">SETTLEMENT · '+(LANG==='zh'?'结算':'精算')+'</div><div class="settle-jp">'+(LANG==='zh'?'精算':'精算')+'</div></div>'
      +txns.map(function(tx){
        return '<div class="settle-row" style="margin-bottom:12px">'
          +'<div class="settle-from">'+tx.from.name+' → '+tx.to.name+'</div>'
          +'<div class="settle-amt-big">'+curSym+Math.round(tx.amt).toLocaleString()+'</div>'
          +'</div>';
      }).join('')
      +'<div class="settle-bar">'
      +members.map(function(m){
        var paid=exps.filter(function(e){return e.payer===m.id;}).reduce(function(s,e){return s+e.amount;},0);
        return'<div style="flex:'+paid+';background:'+m.col.tx+'"></div>';
      }).join('')
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:8px">'
      +members.map(function(m){return'<div style="font-family:var(--mono);font-size:9px;color:var(--muted)">'+m.name+'</div>';}).join('')
      +'</div></div>'
    : '<div class="settle-card"><div class="settle-ok">'+ico('check',16,'var(--red)')+' '+(LANG==='zh'?'账目已平衡':'All settled')+'</div></div>';

  // members
  var memberHtml = '<div class="budget-members">'
    +members.map(function(m){
      return '<div class="m-card"><div class="m-av" style="width:36px;height:36px;font-size:12px;background:'+m.col.bg+';color:'+m.col.tx+'">'+m.name.slice(0,2).toUpperCase()+'</div><div class="m-name">'+m.name+'</div></div>';
    }).join('')
    +(members.length<6?'<div class="m-card"><div class="m-add" style="width:36px;height:36px" onclick="addMember()">+</div><div class="m-name">'+(LANG==='zh'?'添加':'Add')+'</div></div>':'')
    +'</div>';

  return '<div class="page-header">'
    +'<div class="page-title-jp">'+(LANG==='zh'?'账单':'Budget')+'</div>'
    +'<div class="cur-sel-wrap" style="display:flex;align-items:center;gap:8px">'
    +'<span style="font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--muted)">'+(LANG==='zh'?'币种':'CUR')+'</span>'
    +'<select class="cur-sel" style="font-size:12px;padding:4px 6px;border:1px solid var(--hair2);background:var(--card);color:var(--ink);font-family:var(--mono)" onchange="setCurrency(this.value)">'+curOpts+'</select>'
    +'</div></div>'
    // big total
    +'<div class="budget-total">'
    +'<div class="total-mono">TOTAL · '+(LANG==='zh'?'合计':'TRIP')+'</div>'
    +'<div class="total-amount"><span class="total-sym">'+curSym+'</span><div class="total-num">'+Math.round(total).toLocaleString()+'</div></div>'
    +'<div class="total-per">'+(LANG==='zh'?'per person · ':'per person · ')+curSym+Math.round(half).toLocaleString()+'</div>'
    +'</div>'
    +'<div class="red-rule" style="margin:0 22px 18px"></div>'
    // members + settle
    +memberHtml
    +settleHtml
    // who paid
    +'<div style="padding:14px 22px 6px"><div class="section-label">'+(LANG==='zh'?'各人付款':'WHO PAID')+'</div></div>'
    +paidRows
    // expense list
    +'<div class="exp-entries">'
    +'<div class="entries-hdr"><div class="section-label">ENTRIES · '+exps.length+'</div><div class="section-label-jp">'+(LANG==='zh'?'明细':'明細')+'</div></div>'
    +expItems
    +'</div>'
    // add expense
    +'<div class="exp-add-form">'
    +'<div class="section-label" style="margin-bottom:14px">'+(LANG==='zh'?'添加费用':'ADD EXPENSE')+'</div>'
    +'<div class="f-group"><div class="f-label">'+(LANG==='zh'?'项目':'Item')+' <span class="req">*</span></div><input class="f-inp" id="en" placeholder="'+(LANG==='zh'?'e.g. 晚餐':'e.g. Dinner')+'"></div>'
    +'<div class="exp-add-grid">'
    +'<div class="f-group"><div class="f-label">'+(LANG==='zh'?'金额':'Amount')+' <span class="req">*</span></div><input class="f-inp" id="ea" type="number" placeholder="0"></div>'
    +'<div class="f-group"><div class="f-label">'+(LANG==='zh'?'谁付':'Paid by')+'</div><select class="f-sel" id="ep">'+payerOpts+'</select></div>'
    +'<div class="f-group"><div class="f-label">'+(LANG==='zh'?'摊给':'Split')+'</div><select class="f-sel" id="es">'+splitOpts+'</select></div>'
    +'<div class="f-group"><div class="f-label">'+(LANG==='zh'?'类别':'Category')+'</div>'
    +'<select class="f-sel" id="ec"><option value="m">🍜 meal</option><option value="f">✈️ flight</option><option value="h">🏨 hotel</option><option value="t">🎟️ ticket</option><option value="x">🚇 transit</option></select>'
    +'</div></div>'
    +'<button class="btn-red" onclick="addExp()">＋ '+(LANG==='zh'?'添加':'Add')+'</button>'
    +'</div>';
}

      return '<div class="picker-item'+(sel?' sel':'')+'" onclick="tglPicker(this.dataset.pid)" data-pid="'+p.id+'">'

        +(dist?'<div class="pi-dist">'+dist+'</div>':'')+'</div>';
    }).join('') || '<div style="padding:20px 22px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px">'+(LANG==='zh'?'先在准备>景点添加':'Add in Prepare > Sights')+'</div>';
  } else if(cat==='food') {

        +'<div style="flex:1"><div class="pi-name">'+name+'</div>'+(r.loc?'<div class="pi-sub">'+r.loc+'</div>':'')+'</div>'
        +'<div class="pi-dist">🍜</div></div>';
    }).join('') || '<div style="padding:20px 22px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px">'+(LANG==='zh'?'先在更多>餐饮添加':'Add in More > Food')+'</div>';
  } else if(cat==='transport') {
    items = d.transport.map(function(tp){
      var sel=S.pickerSel.indexOf('t_'+tp.id)>=0;
      return '<div class="picker-item'+(sel?' sel':'')+'" onclick="tglPicker(this.dataset.pid)" data-pid="t_'+tp.id+'">'
        +'<div class="pi-circ"><span class="pi-tick">&#x2713;</span></div>'
        +'<div style="flex:1"><div class="pi-name">'+(LANG==='zh'?tp.cn:tp.en)+'</div>'+(tp.detail?'<div class="pi-sub">'+tp.detail+'</div>':'')+'</div>'
        +'<div class="pi-dist">'+(TICONS[tp.type]||'🚐')+'</div></div>';
    }).join('') || '<div style="padding:20px 22px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px">'+(LANG==='zh'?'先在更多>交通添加':'Add in More > Transport')+'</div>';
  }
  document.getElementById('pickerList').innerHTML = catBar + items;
}

function updateUserBadge() {
  if(!currentUser)return;
  var badge=document.getElementById('userBadge');
  var pip=document.getElementById('userPip');
  var nm=document.getElementById('userNm');
  var syncPip=document.getElementById('syncPip');
  if(badge){badge.style.display='flex';}
  if(pip){pip.style.background=currentUser.color;pip.textContent=currentUser.initials;}
  if(nm){nm.textContent=currentUser.name;}
  if(syncPip){syncPip.style.display='block';}
}
function updateSyncIndicator(status) {
  syncStatus=status;
  var el=document.getElementById('syncPip');
  if(!el)return;
  el.className='sync-pip '+status;
}
